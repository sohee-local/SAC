name: Update Horoscope RSS

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC = 오전 9시 (KST)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run parser script
        run: python rss_parser.py

      - name: Commit and push changes
        run: |
          git config user.name "sohee-local"
          git config user.email "sohui0718@naver.com"
          git add filtered_horoscope_feed.xml
          git commit -m "⏰ 자동 업데이트: 오늘의 운세" || echo "No changes"
          git push
